## Ziwo "banshee" module set for FreeSWITCH v1.11.1.1
## Derived from the live production build (38 auto-loaded modules on the v1.10.11.2 VM).
## This file controls which modules are COMPILED. Runtime loading is controlled by
## autoload_configs/modules.conf.xml.
## NOTE: use '##' for human comments here -- single '#' lines are parsed by the build
## as DISABLED modules, so prose after a single '#' breaks the generated Makefile.
## mod_callcenter and mod_verto carry Ziwo custom code.

## Loggers
loggers/mod_console
loggers/mod_logfile

## Languages
languages/mod_lua

## XML interfaces
xml_int/mod_xml_rpc
xml_int/mod_xml_curl

